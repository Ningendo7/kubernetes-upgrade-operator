apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubernetes-upgrade-operator-executor
  namespace: kubernetes-upgrade-operator-executor
  labels:
    app.kubernetes.io/name: kubernetes-upgrade-operator
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/component: executor
# No RoleBinding exists anywhere for this ServiceAccount, deliberately:
# the executor Job never talks to the Kubernetes API at all, so it needs
# zero permissions. automountServiceAccountToken is also set false here
# as a second, independent enforcement point (it's set on the Pod
# template in pkg/provider/kubeadm/executor.go too)
automountServiceAccountToken: false