# This rule is not used by the project kubernetes-upgrade-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the upgrade.k8s-upgrade-operator.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: kubernetes-upgrade-operator
    app.kubernetes.io/managed-by: kustomize
  name: nodegroupupgrade-editor-role
rules:
- apiGroups:
  - upgrade.k8s-upgrade-operator
  resources:
  - nodegroupupgrades
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - upgrade.k8s-upgrade-operator
  resources:
  - nodegroupupgrades/status
  verbs:
  - get
