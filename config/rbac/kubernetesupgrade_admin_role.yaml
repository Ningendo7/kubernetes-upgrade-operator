# This rule is not used by the project kubernetes-upgrade-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over upgrade.k8s-upgrade-operator.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: kubernetes-upgrade-operator
    app.kubernetes.io/managed-by: kustomize
  name: kubernetesupgrade-admin-role
rules:
- apiGroups:
  - upgrade.k8s-upgrade-operator
  resources:
  - kubernetesupgrades
  verbs:
  - '*'
- apiGroups:
  - upgrade.k8s-upgrade-operator
  resources:
  - kubernetesupgrades/status
  verbs:
  - get
