# This rule is not used by the project kubernetes-upgrade-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to upgrade.k8s-upgrade-operator resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: kubernetes-upgrade-operator
    app.kubernetes.io/managed-by: kustomize
  name: kubernetesupgrade-viewer-role
rules:
- apiGroups:
  - upgrade.k8s-upgrade-operator
  resources:
  - kubernetesupgrades
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - upgrade.k8s-upgrade-operator
  resources:
  - kubernetesupgrades/status
  verbs:
  - get
