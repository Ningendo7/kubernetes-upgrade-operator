apiVersion: upgrade.k8s-upgrade-operator/v1alpha1
kind: NodeGroupUpgrade
metadata:
  labels:
    app.kubernetes.io/name: kubernetes-upgrade-operator
    app.kubernetes.io/managed-by: kustomize
  name: nodegroupupgrade-sample
spec:
  # NodeGroupUpgrade objects are normally created and managed by the
  # KubernetesUpgrade controller's discovery process, not applied directly -
  # this sample exists mainly to document the shape of the API and for
  # local experimentation against a test cluster.
  targetVersion: "v1.30.0"
  role: Worker
  provider: Kubeadm
  strategy: InPlace
  nodeSelector:
    matchLabels:
      node-role.kubernetes.io/worker: ""
